<!DOCTYPE html>
<html lang="es">
<head>
    <!-- En tu barra de navegación dentro del HTML -->
<div class="navbar-brand">
    <img src="/assets/logo.svg" alt="BytePay Logo" width="45" height="45">
    <span>BytePay</span>
</div>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoTech | Portal Institucional</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-mobile-container">
        <header class="app-header">
            <div class="user-badge-container">
                <div class="user-avatar-circle">JT</div>
                <div class="user-level-text">Portal Corporativo</div>
            </div>
        </header>

        <div class="screen-view">
            <div style="text-align: center; margin: 2rem 0 1.5rem 0;">
                <div style="width: 60px; height: 60px; background: var(--primary); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 1.6rem; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);">JT</div>
                <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--dark); margin-top: 0.75rem;">JoTech System</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Gestión de contratos y financiamiento.</p>
            </div>

            <div class="form-group">
                <label for="inputContratoLogin">Número de Contrato</label>
                <input type="text" id="inputContratoLogin" placeholder="Ej: C-1001" style="text-transform: uppercase;">
            </div>

            <button type="button" class="btn-primary" id="btnLoginCliente">Acceder a mis Contratos</button>

            <div style="text-align: center; margin-top: 2rem;">
                <a href="./admin-login.html" style="color: var(--primary); font-size: 0.8rem; font-weight: 700; text-decoration: none;">Acceso Administrativo</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbWF2cTQdwgjaxQqQb3BMPJCKFs0ftEM",
            authDomain: "jotech-contratos.firebaseapp.com",
            projectId: "jotech-contratos",
            storageBucket: "jotech-contratos.firebasestorage.app",
            messagingSenderId: "109219790720",
            appId: "1:109219790720:web:84149d0f2199f0adbf0b65"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btnLoginCliente').addEventListener('click', async () => {
            const codigo = document.getElementById('inputContratoLogin').value.trim().toUpperCase();
            if (!codigo) { alert("Introduce un número de contrato."); return; }

            try {
                const docSnap = await getDoc(doc(db, "contratos", codigo));
                if (docSnap.exists()) {
                    localStorage.setItem('jotech_contrato', codigo);
                    window.location.href = './dashboard.html';
                } else {
                    alert("El contrato no existe en el sistema.");
                }
            } catch (e) {
                console.error(e);
                alert("Error de conexión con la base de datos.");
            }
        });
    </script>
</body>
</html>
